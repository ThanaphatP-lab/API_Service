worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format model_api '$remote_addr - $request_id [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log model_api;

    # Edge limits supplement the application limiter and protect Uvicorn before
    # a request body reaches Python. Tune these values for the expected workload.
    limit_req_zone $binary_remote_addr zone=model_api_rate:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=model_api_connections:10m;
    map $http_x_request_id $model_request_id {
        default $http_x_request_id;
        "" $request_id;
    }

    upstream model_gateway {
        server 127.0.0.1:8080;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name api.example.com;
        # Use the canonical host instead of reflecting an untrusted Host header.
        return 308 https://api.example.com$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.example.com;

        # Replace these paths with certificates managed by the server/platform.
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        client_max_body_size 28m;
        client_body_timeout 30s;
        keepalive_timeout 30s;
        limit_req_status 429;
        limit_conn_status 429;
        error_page 413 = @payload_too_large;
        error_page 429 = @rate_limited;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;

        # Documentation is disabled by APP_ENV=production as well. These rules
        # provide defense in depth at the public edge.
        location = /docs { return 404; }
        location = /redoc { return 404; }
        location = /openapi.json { return 404; }
        location = /predict { return 404; }

        location @payload_too_large {
            default_type application/json;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Cache-Control "no-store" always;
            add_header X-Request-ID $request_id always;
            return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"The request body exceeds the edge size limit.","details":[],"request_id":"$request_id","docs":""}}';
        }

        location @rate_limited {
            default_type application/json;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Cache-Control "no-store" always;
            add_header X-Request-ID $request_id always;
            add_header Retry-After 1 always;
            return 429 '{"error":{"code":"RATE_LIMIT_EXCEEDED","message":"Too many requests. Retry later.","details":[{"retry_after_seconds":1}],"request_id":"$request_id","docs":""}}';
        }

        location / {
            limit_req zone=model_api_rate burst=10 nodelay;
            limit_conn model_api_connections 10;

            proxy_pass http://model_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Overwrite client-supplied X-Forwarded-For. The app trusts this
            # header only when TRUST_PROXY_HEADERS=true behind this proxy.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $model_request_id;

            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_request_buffering on;
            proxy_hide_header X-Powered-By;
        }
    }
}
